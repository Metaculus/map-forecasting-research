[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "map-forecasting"
version = "0.1.0"
description = "Consistency checks for probability estimates, and tools to build, clean and grade causal forecasting maps and key factors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pydantic>=2",
]

[project.optional-dependencies]
openai = ["openai>=1"]
anthropic = ["anthropic"]
radiant = ["httpx", "pydantic-ai"]
dev = ["pytest", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/map_forecasting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
